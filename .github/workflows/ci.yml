name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_APPWRITE_DATABASE_ID: ${{ vars.VITE_APPWRITE_DATABASE_ID }}
          VITE_APPWRITE_COLLECTION_ID: ${{ vars.VITE_APPWRITE_COLLECTION_ID }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
        run: |
          printf "VITE_APPWRITE_DATABASE_ID=%s\nVITE_APPWRITE_COLLECTION_ID=%s\nVITE_APPWRITE_PROJECT_ID=%s\n" \
            "$VITE_APPWRITE_DATABASE_ID" "$VITE_APPWRITE_COLLECTION_ID" "$VITE_APPWRITE_PROJECT_ID" > .env
          npm run build

